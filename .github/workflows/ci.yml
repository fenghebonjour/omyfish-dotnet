name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly run on main — catches dependency drift even when no code changes.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test omyfish-dotnet.slnx --logger "console;verbosity=minimal"
