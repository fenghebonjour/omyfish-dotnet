apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-gateway
spec:
  replicas: {{ .Values.replicaCount.apiGateway }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # Matches the Dockerfile's `USER $APP_UID` — fails fast if the image ever
      # regresses to running as root (BACKLOG.md item F, WEAKNESS_AUDIT.md §1.4).
      securityContext:
        runAsNonRoot: true
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-gateway
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.image.apiGateway.repository }}:{{ .Values.image.apiGateway.tag }}"
          imagePullPolicy: {{ .Values.image.apiGateway.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: omyfish-secrets
                  key: jwt-secret
            - name: Services__Identity
              value: "http://identity-service:8080"
            - name: Services__Species
              value: "http://species-service:8080"
            - name: Services__Observation
              value: "http://observation-service:8080"
          resources:
            {{- toYaml .Values.resources.apiGateway | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
