              value: "rabbitmq"
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: omyfish-secrets
                  key: rabbitmq-username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: omyfish-secrets
                  key: rabbitmq-password
            - name: AIService__BaseUrl
              value: "http://ai-service:8000"
            - name: MongoDB__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: omyfish-secrets
                  key: mongodb-connection-string
            - name: MongoDB__Database
              value: "omyfish"
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: omyfish-secrets
                  key: jwt-secret
            - name: Seeding__MetadataPath
              value: "/metadata/fish_info.json"
          volumeMounts:
            - name: fish-metadata
              mountPath: /metadata
              readOnly: true
          resources:
            {{- toYaml .Values.resources.speciesService | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: fish-metadata
          configMap:
            name: fish-metadata
