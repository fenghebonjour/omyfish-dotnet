apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: ai-service
spec:
  replicas: {{ .Values.replicaCount.aiService }}
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ai-service
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.image.aiService.repository }}:{{ .Values.image.aiService.tag }}"
          imagePullPolicy: {{ .Values.image.aiService.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: "/checkpoints/best.pt"
            - name: CLASSES_PATH
              value: "/checkpoints/classes.json"
            - name: METADATA_PATH
              value: "/metadata/fish_info.json"
          volumeMounts:
            - name: model-checkpoints
              mountPath: /checkpoints
              readOnly: true
            - name: fish-metadata
              mountPath: /metadata
              readOnly: true
          resources:
            {{- toYaml .Values.resources.aiService | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: model-checkpoints
          persistentVolumeClaim:
            claimName: ai-model-pvc
        - name: fish-metadata
          configMap:
            name: fish-metadata
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: ai-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
