version: "3.9"

networks:
  omyfish-net:
    driver: bridge
  # Created by ../omyfish-ai's compose — start that stack first:
  #   cd ../omyfish-ai && docker compose up -d
  omyfish-shared:
    external: true

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  mongo_data:
  prometheus_data:
  grafana_data:

services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: omyfish
      POSTGRES_USER: omyfish
      POSTGRES_PASSWORD: omyfish_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omyfish"]
      interval: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: omyfish
      RABBITMQ_DEFAULT_PASS: omyfish_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: omyfish
      MINIO_ROOT_PASSWORD: omyfish_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [omyfish-net]

  # Species catalog store (BACKLOG.md item E) — read-mostly, flexible-schema reference data
  # with no relational integrity needs, so it doesn't belong on Postgres. Mirrors
  # omyfish-java's mongodb service.
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: omyfish
      MONGO_INITDB_ROOT_PASSWORD: omyfish_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [omyfish-net]

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    networks: [omyfish-net]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
    networks: [omyfish-net]

  # ─── AI Service (Python — preserved from omyfish) ─────────────────────────
  # Prefers the shared instance from ../omyfish-ai's own compose, on the
  # omyfish-shared network. `make up`/`make build-up` auto-detect it via
  # :8000/health and fall back to starting this bundled copy (profiles:
  # [bundled]) if it's not reachable. To invoke this profile directly:
  # docker compose --profile bundled up -d
  # (conflicts with the external instance on host port 8000 — run only one).

  ai-service:
    profiles: [bundled]
    build:
      context: ../omyfish-ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ../omyfish-ai/.env
        required: false
    environment:
      MODEL_PATH: /checkpoints/best.pt
      CLASSES_PATH: /checkpoints/classes.json
      METADATA_PATH: /metadata/fish_info.json
    volumes:
      - ../omyfish-python/checkpoints:/checkpoints:ro
      - ../omyfish-python/data/metadata:/metadata:ro
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

  # ─── .NET Microservices ────────────────────────────────────────────────────

  identity-service:
    build:
      context: .
      dockerfile: src/services/IdentityService/OMyFish.IdentityService.Api/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=omyfish;Username=omyfish;Password=omyfish_dev"
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: "dev-secret-change-in-production-min-32-chars"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [omyfish-net]

  species-service:
    build:
      context: .
      dockerfile: src/services/SpeciesService/OMyFish.SpeciesService.Api/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=omyfish;Username=omyfish;Password=omyfish_dev"
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: "dev-secret-change-in-production-min-32-chars"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: omyfish
      RabbitMq__Password: omyfish_dev
      AIService__BaseUrl: "http://ai-service:8000"
      MinIO__Endpoint: "minio:9000"
      MinIO__AccessKey: omyfish
      MinIO__SecretKey: omyfish_dev
      MongoDB__ConnectionString: "mongodb://omyfish:omyfish_dev@mongodb:27017/omyfish?authSource=admin"
      MongoDB__Database: omyfish
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      Seeding__MetadataPath: "/metadata/fish_info.json"
    volumes:
      - ../omyfish-python/data/metadata:/metadata:ro
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    networks: [omyfish-net, omyfish-shared]

  observation-service:
    build:
      context: .
      dockerfile: src/services/ObservationService/OMyFish.ObservationService.Api/Dockerfile
    ports:
      - "8083:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=omyfish;Username=omyfish;Password=omyfish_dev"
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: "dev-secret-change-in-production-min-32-chars"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: omyfish
      RabbitMq__Password: omyfish_dev
      MinIO__Endpoint: "minio:9000"
      MinIO__AccessKey: omyfish
      MinIO__SecretKey: omyfish_dev
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [omyfish-net]

  notification-service:
    build:
      context: .
      dockerfile: src/services/NotificationService/OMyFish.NotificationService/Dockerfile
    ports:
      - "8084:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=omyfish;Username=omyfish;Password=omyfish_dev"
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: "dev-secret-change-in-production-min-32-chars"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: omyfish
      RabbitMq__Password: omyfish_dev
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [omyfish-net]

  api-gateway:
    build:
      context: ./src
      dockerfile: services/ApiGateway/OMyFish.ApiGateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: "dev-secret-change-in-production-min-32-chars"
      Services__Identity: "http://identity-service:8080"
      Services__Species: "http://species-service:8080"
      Services__Observation: "http://observation-service:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      identity-service: { condition: service_healthy }
      species-service: { condition: service_healthy }
      observation-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    networks: [omyfish-net]

  # ─── Frontend ─────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend/omyfish-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      api-gateway: { condition: service_healthy }
    networks: [omyfish-net]
